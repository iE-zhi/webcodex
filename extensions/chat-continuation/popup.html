<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>WebCodex Continuation</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header><h1 data-text="title">长任务续跑</h1><button id="language" class="quiet" type="button">EN</button></header>
  <p id="status" role="status" aria-live="polite">读取中…</p>
  <p id="error" role="alert" hidden></p>
  <p id="connectionStatus" role="status" aria-live="polite" data-state="checking">正在检查后端连接…</p>
  <details id="connectionPanel">
    <summary data-text="connection">后端连接</summary>
    <form id="connectionForm">
      <label for="serverUrl" data-text="serverUrl">Server 地址</label>
      <!-- 地址最多 2048 字符，同时限制会话草稿的大小。 -->
      <input id="serverUrl" type="url" placeholder="http://127.0.0.1:8080" maxlength="2048" required>
      <label for="serverToken" data-text="serverToken">会话协作 PAT</label>
      <input id="serverToken" type="password" autocomplete="off" maxlength="2055" aria-describedby="tokenHint" required>
      <p id="tokenHint" class="hint"></p>
      <button id="connect" type="submit" data-text="connect">连接</button>
    </form>
  </details>
  <button id="continue" type="button" data-text="continue" disabled>Continue · 自动恢复</button>
  <form id="settings">
    <label for="objective" data-text="objective">任务目标</label>
    <textarea id="objective" maxlength="2000" rows="4"></textarea>
    <div class="row">
      <label for="mode" data-text="mode">续跑方式</label>
      <select id="mode"><option value="goal" data-text="goal">Goal · 完成后停止</option><option value="loop" data-text="loop">Loop · 持续推进</option><option value="continue" data-text="continue">Continue · 自动恢复</option></select>
    </div>
    <div class="row"><label for="limit" data-text="limit">最多续跑轮数</label><input id="limit" type="number" min="1" max="10000" value="100" required></div>
    <div class="row"><label for="delay" data-text="delay">间隔（秒）</label><input id="delay" type="number" min="30" max="3600" value="30" required></div>
    <details id="recoverySettings">
      <summary data-text="recoverySettings">恢复与触发</summary>
      <div class="row"><label for="recovery" data-text="recovery">自动恢复中断</label><input id="recovery" type="checkbox" checked></div>
      <div class="row"><label for="adaptiveTiming" data-text="adaptiveTiming">按模型调整等待</label><input id="adaptiveTiming" type="checkbox" checked></div>
      <div class="row"><label for="continuous" data-text="continuous">保持本会话启用</label><input id="continuous" type="checkbox" checked></div>
      <div class="row"><label for="silenceSeconds" data-text="silenceSeconds">基础静默等待（秒）</label><input id="silenceSeconds" type="number" min="120" max="3600" value="600" required></div>
      <div class="row"><label for="lifetimeHours" data-text="lifetimeHours">有效期（小时）</label><input id="lifetimeHours" type="number" min="1" max="720" value="24" required></div>
      <label for="localRunner" data-text="localRunner">本机 Runner ID（可选）</label><input id="localRunner" maxlength="128" pattern="[A-Za-z0-9_.-]+" autocomplete="off">
      <div class="row"><label for="keepAwake" data-text="keepAwake">活动任务期间防休眠</label><input id="keepAwake" type="checkbox" disabled></div>
      <p class="hint" data-text="runnerHint">需在本机 Runner 的 continuation 配置中启用浏览器恢复。</p>
      <label for="sessionId" data-text="sessionId">关联 Workflow Session（可选）</label><input id="sessionId" type="text" maxlength="128" autocomplete="off">
      <div class="row"><label for="trigger" data-text="trigger">触发时机</label><select id="trigger"><option value="after_turn" data-text="afterTurn">每回合结束</option><option value="finish" data-text="afterFinish">finish 工具后</option></select></div>
      <p class="hint" data-text="sessionHint">可留空，由当前 ChatGPT 自动关联 Session；finish 在原生工具中交接后续工作。</p>
    </details>
    <p class="hint" data-text="boundary">自动发送占用当前 ChatGPT 账户额度；需要批准或补充信息时暂停。</p>
    <div class="actions"><button id="start" type="submit" data-text="start" disabled>启用当前会话</button><button id="pause" class="secondary" type="button" data-text="pause" disabled>暂停</button></div>
  </form>
  <details id="queuePanel">
    <summary data-text="queueTitle">排队输入与工作流</summary>
    <label for="queueKind" data-text="queueKind">输入类型</label>
    <select id="queueKind"><option value="message" data-text="queueMessage">人工输入</option><option value="workflow" data-text="queueWorkflow">完整工作流（每行一个阶段）</option></select>
    <label for="queueText" data-text="queueText">排队内容</label><textarea id="queueText" maxlength="8000" rows="3"></textarea>
    <div class="actions"><button id="queueAdd" type="button" data-text="queueAdd" disabled>加入队列</button><button id="queuePlan" type="button" class="secondary" data-text="queuePlan" disabled>当前 ChatGPT 规划</button></div>
    <label for="queueEntries" data-text="queueEntries">等待投递</label><select id="queueEntries"></select>
    <button id="queueRemove" type="button" class="quiet" data-text="remove" disabled>移除</button>
  </details>
  <footer><label for="tasks" data-text="tasks">已保存任务</label><div class="actions"><select id="tasks" aria-label="已保存任务"></select><button id="remove" class="quiet" type="button" data-text="remove" disabled>移除</button></div></footer>
  <script type="module" src="popup.mjs"></script>
</body>
</html>
