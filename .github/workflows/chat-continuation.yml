name: Server-owned chat continuation

on:
  push:
    paths: ['crates/webcodex-continuation/**', 'crates/webcodex-core/src/continuation.rs', 'crates/webcodex-runner/**', 'crates/webcodex-workflow-session/**', 'crates/webcodex-tool-contracts/**', 'crates/webcodex-tool-runtime-contracts/**', 'src/continuation_local_http.rs', 'src/tool_runtime/continuation.rs', 'src/tool_runtime/dispatch/**', 'src/continuation_http.rs', 'src/continuation_runtime.rs', 'src/tool_runtime/tests/mod.rs', 'src/lib.rs', 'src/server_file_config.rs', 'src/route_metadata.rs', 'src/route_metadata/**', 'Cargo.toml', 'Cargo.lock', 'extensions/chat-continuation/**', 'tests/chat-continuation/**', '.github/workflows/chat-continuation.yml']
  pull_request:
    paths: ['crates/webcodex-continuation/**', 'crates/webcodex-core/src/continuation.rs', 'crates/webcodex-runner/**', 'crates/webcodex-workflow-session/**', 'crates/webcodex-tool-contracts/**', 'crates/webcodex-tool-runtime-contracts/**', 'src/continuation_local_http.rs', 'src/tool_runtime/continuation.rs', 'src/tool_runtime/dispatch/**', 'src/continuation_http.rs', 'src/continuation_runtime.rs', 'src/tool_runtime/tests/mod.rs', 'src/lib.rs', 'src/server_file_config.rs', 'src/route_metadata.rs', 'src/route_metadata/**', 'Cargo.toml', 'Cargo.lock', 'extensions/chat-continuation/**', 'tests/chat-continuation/**', '.github/workflows/chat-continuation.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Test state, delivery and isolated browser UI
        run: cargo test --locked -p webcodex-continuation
      - name: Test native Session coordination
        run: cargo test --locked -p webcodex --lib tool_runtime::tests::continuation_runtime
      - name: Test local Runner lease adapter
        run: cargo test --locked -p webcodex-runner continuation::tests
      - name: Test Tunnel account credential isolation
        run: cargo test --locked -p webcodex --lib server_file_config::continuation_tunnel_tests
      - name: Build real Server for authenticated end-to-end verification
        run: cargo build --locked -p webcodex --bin webcodex-server
      - name: Test backend and browser adapter
        run: node --test tests/chat-continuation/*.test.mjs
