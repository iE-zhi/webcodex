name: Extended native CI

run-name: Extended native ${{ inputs.source_sha }}

on:
  workflow_call:
    inputs:
      source_sha:
        description: Exact 40-character source commit to validate
        required: true
        type: string
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact 40-character source commit to validate
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: extended-native-${{ inputs.source_sha }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Validate exact source input
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]

  linux-arm64:
    needs: source
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 1
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: extended-linux-arm64-ci
      - name: Validate native Server, Runner and Computer
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(uname -m)" = aarch64
          test "$(rustc -vV | sed -n 's/^host: //p')" = aarch64-unknown-linux-gnu
          cargo check --locked -p webcodex -p webcodex-runner
          cargo test --locked -p webcodex-runner -p webcodex-computer
          git diff --check
          test -z "$(git status --porcelain --untracked-files=all)"

  macos-intel:
    needs: source
    runs-on: macos-15-intel
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 1
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: extended-macos-intel-ci
      - name: Validate native Server, Runner and Computer
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(uname -m)" = x86_64
          test "$(rustc -vV | sed -n 's/^host: //p')" = x86_64-apple-darwin
          cargo check --locked --workspace
          cargo test --locked -p webcodex-runner -p webcodex-computer
          cargo build --locked --profile dogfood --bins -p webcodex -p webcodex-runner
          for binary in webcodex-server webcodex-runner; do
            test "$(lipo -archs "target/dogfood/$binary")" = x86_64
          done
          git diff --check
          test -z "$(git status --porcelain --untracked-files=all)"

  windows-arm64:
    needs: source
    runs-on: windows-11-arm
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 1
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          targets: aarch64-pc-windows-msvc
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: extended-windows-arm64-ci
      - name: Validate native Server, Runner and Computer
        shell: pwsh
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          $ErrorActionPreference = "Stop"
          if ((git rev-parse HEAD).Trim() -ne $env:SOURCE_SHA) { throw "Source mismatch" }
          if ($env:PROCESSOR_ARCHITECTURE -ne 'ARM64') { throw "Expected Windows ARM64" }
          $rustHost = (rustc -vV | Select-String '^host: ').Line
          if ($rustHost -ne 'host: aarch64-pc-windows-msvc') { throw "Unexpected Rust host" }
          cargo check --locked -p webcodex -p webcodex-runner
          if ($LASTEXITCODE -ne 0) { throw "Native runtime check failed" }
          cargo test --locked -p webcodex-runner -p webcodex-computer
          if ($LASTEXITCODE -ne 0) { throw "Runner/Computer tests failed" }
          cargo build --locked --profile dogfood --bins -p webcodex -p webcodex-runner
          if ($LASTEXITCODE -ne 0) { throw "Runtime build failed" }
          foreach ($name in @("webcodex-server", "webcodex-runner")) {
            $binary = "target/dogfood/$name.exe"
            if (-not (Test-Path -LiteralPath $binary)) { throw "Missing $binary" }
          }
          git diff --check
          if ($LASTEXITCODE -ne 0) { throw "Diff check failed" }
          if (@(git status --porcelain --untracked-files=all).Count -ne 0) { throw "Dirty checkout" }

  summary:
    needs: [source, linux-arm64, macos-intel, windows-arm64]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require all native lanes
        env:
          SOURCE_RESULT: ${{ needs.source.result }}
          LINUX_ARM64_RESULT: ${{ needs.linux-arm64.result }}
          MACOS_INTEL_RESULT: ${{ needs.macos-intel.result }}
          WINDOWS_ARM64_RESULT: ${{ needs.windows-arm64.result }}
        run: |
          set -euo pipefail
          for result in "$SOURCE_RESULT" "$LINUX_ARM64_RESULT" "$MACOS_INTEL_RESULT" "$WINDOWS_ARM64_RESULT"; do
            test "$result" = success
          done
