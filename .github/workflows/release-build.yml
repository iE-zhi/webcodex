name: Release build candidates

run-name: Release build ${{ inputs.tag }} ${{ inputs.request_id }}

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing annotated release tag (v0.3.9) or verification tag (release-build-test-*)
        required: true
        type: string
      request_id:
        description: Durable operator correlation id (rb_<24 hex>) or manual
        required: false
        default: manual
        type: string
      include_runtime_installers:
        description: Build Linux Runtime DEB/RPM installers (requires unified installers and a release tag)
        required: false
        default: false
        type: boolean
      include_unified_installers:
        description: Build optional unified distro installers in addition to the core release
        required: false
        default: false
        type: boolean

# This workflow only produces candidate bytes and one same-run assembled bundle.
# It has no release, package, deployment, or repository-write permission. A
# trusted publication control host owns collection, staging, and publication.
permissions:
  contents: read

concurrency:
  group: release-build-${{ inputs.tag }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
          ref: refs/tags/${{ inputs.tag }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      # The static release gate runs test_inventory.sh self-tests, which require rg.
      # Ubuntu runner images do not guarantee ripgrep; match ordinary CI setup.
      - name: Ensure test inventory dependency
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v rg >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install --no-install-recommends -y ripgrep
          fi
      - name: Fail fast on deterministic release contracts
        shell: bash
        env:
          INPUT_TAG: ${{ inputs.tag }}
          INCLUDE_RUNTIME_INSTALLERS: ${{ inputs.include_runtime_installers }}
          INCLUDE_UNIFIED_INSTALLERS: ${{ inputs.include_unified_installers }}
        run: |
          set -euo pipefail
          if [ "${INCLUDE_RUNTIME_INSTALLERS:-false}" = true ] || [ "${INCLUDE_UNIFIED_INSTALLERS:-false}" = true ]; then
            echo "Headless release no longer produces Desktop-based installers." >&2
            exit 1
          fi
          test "$GITHUB_REF" = "refs/tags/$INPUT_TAG"
          test "$(git rev-parse HEAD)" = "$(git rev-list -n 1 "$INPUT_TAG")"
          bash scripts/release_check.sh --static-only

  prepare:
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.metadata.outputs.version }}
      source_sha: ${{ steps.metadata.outputs.source_sha }}
      built_at: ${{ steps.metadata.outputs.built_at }}
      build_kind: ${{ steps.metadata.outputs.build_kind }}
      archive_stem: ${{ steps.metadata.outputs.archive_stem }}
    steps:
      - name: Require immutable tagged workflow source
        shell: bash
        env:
          INPUT_TAG: ${{ inputs.tag }}
          INPUT_REQUEST_ID: ${{ inputs.request_id }}
        run: |
          set -euo pipefail
          tag="$INPUT_TAG"
          request_id="$INPUT_REQUEST_ID"
          if [ "$request_id" != "manual" ] && [[ ! "$request_id" =~ ^rb_[0-9a-f]{24}$ ]]; then
            echo "Invalid release-build request id: $request_id" >&2
            exit 1
          fi
          if [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            :
          elif [[ "$tag" =~ ^release-build-test-[0-9A-Za-z][0-9A-Za-z._-]*$ ]] && [ "${#tag}" -le 80 ]; then
            :
          else
            echo "Invalid release or verification tag: $tag" >&2
            exit 1
          fi
          if [ "$GITHUB_REF" != "refs/tags/$tag" ]; then
            echo "Release candidate builds must be dispatched from the exact immutable tag." >&2
            exit 1
          fi

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
          ref: refs/tags/${{ inputs.tag }}

      - name: Resolve immutable release metadata
        id: metadata
        shell: bash
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          tag="$INPUT_TAG"
          if [[ "$tag" =~ ^v[0-9] ]]; then
            build_kind=release
            version="${tag#v}"
          else
            build_kind=verification
            version=""
          fi

          if [ "$(git cat-file -t "$tag")" != "tag" ]; then
            echo "$tag must be an annotated tag." >&2
            exit 1
          fi

          source_sha="$(git rev-list -n 1 "$tag")"
          if [ "$(git rev-parse HEAD)" != "$source_sha" ]; then
            echo "Checked-out HEAD does not match $tag." >&2
            exit 1
          fi
          if [ -n "$(git status --porcelain --untracked-files=all)" ]; then
            echo "Release candidate checkout is not clean." >&2
            exit 1
          fi

          package_version="$(
            python3 - "$build_kind" "$version" <<'PY'
          import sys
          from pathlib import Path

          from scripts import release_publication

          build_kind, requested = sys.argv[1:]
          versions = release_publication._package_versions(Path.cwd())
          unique = set(versions.values())
          if len(unique) != 1:
              detail = " ".join(f"{name}={value}" for name, value in versions.items())
              raise SystemExit(f"Canonical release versions disagree: {detail}")
          current = versions["cargo"]
          if build_kind == "release" and current != requested:
              raise SystemExit(f"Tag/source version mismatch: tag={requested} source={current}")
          print(current)
          PY
          )"
          if [ "$build_kind" = verification ]; then
            version="$package_version"
          fi


          short_source="${source_sha:0:12}"
          if [ "$build_kind" = release ]; then
            archive_stem="webcodex-v$version"
          else
            archive_stem="webcodex-$tag-$short_source-v$version"
          fi

          # An annotated tag has a stable tagger timestamp. Reusing it makes a
          # rerun of the same immutable tag produce one shared built_at value
          # across every platform and every workflow attempt.
          built_at="$(git for-each-ref --format='%(taggerdate:unix)' "refs/tags/$tag")"
          if [[ ! "$built_at" =~ ^[0-9]+$ ]]; then
            echo "Could not resolve an annotated tagger timestamp for $tag." >&2
            exit 1
          fi

          {
            echo "version=$version"
            echo "source_sha=$source_sha"
            echo "built_at=$built_at"
            echo "build_kind=$build_kind"
            echo "archive_stem=$archive_stem"
          } >> "$GITHUB_OUTPUT"
          {
            echo "### Release build source"
            echo "- kind: \`$build_kind\`"
            echo "- tag: \`$tag\`"
            echo "- commit: \`$source_sha\`"
            echo "- built_at: \`$built_at\`"
            echo "- archive stem: \`$archive_stem\`"
          } >> "$GITHUB_STEP_SUMMARY"

  linux:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x64
            runner: ubuntu-latest
            image: quay.io/pypa/manylinux2014_x86_64
            machine: x86_64
            elf_machine: Advanced Micro Devices X86-64
          - platform: linux-arm64
            runner: ubuntu-24.04-arm
            image: quay.io/pypa/manylinux2014_aarch64
            machine: aarch64
            elf_machine: AArch64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 75
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      SOURCE_SHA: ${{ needs.prepare.outputs.source_sha }}
      WEBCODEX_BUILT_AT: ${{ needs.prepare.outputs.built_at }}
      WEBCODEX_RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
      BUILD_KIND: ${{ needs.prepare.outputs.build_kind }}
      WEBCODEX_GIT_COMMIT: ${{ needs.prepare.outputs.source_sha }}
      WEBCODEX_GIT_DIRTY: 'false'
      ARCHIVE_STEM: ${{ needs.prepare.outputs.archive_stem }}
      WEBCODEX_RELEASE_PLATFORM: ${{ matrix.platform }}
      MANYLINUX_IMAGE: ${{ matrix.image }}
      CARGO_CACHE_DIR: /tmp/webcodex-release-cargo-${{ matrix.platform }}
      RUSTUP_CACHE_DIR: /tmp/webcodex-release-rustup-${{ matrix.platform }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
          ref: refs/tags/${{ inputs.tag }}

      - name: Restore Rust build cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ${{ env.CARGO_CACHE_DIR }}
            ${{ env.RUSTUP_CACHE_DIR }}
            target
          key: release-${{ matrix.platform }}-${{ hashFiles('Cargo.lock') }}-v1
          restore-keys: |
            release-${{ matrix.platform }}-

      - name: Build and verify inside glibc 2.17 userspace
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$CARGO_CACHE_DIR" "$RUSTUP_CACHE_DIR" dist

          docker run --rm \
            -v "$GITHUB_WORKSPACE:/work" \
            -v "$CARGO_CACHE_DIR:/cargo" \
            -v "$RUSTUP_CACHE_DIR:/rustup" \
            -w /work \
            -e CARGO_HOME=/cargo \
            -e RUSTUP_HOME=/rustup \
            -e VERSION \
            -e SOURCE_SHA \
            -e WEBCODEX_BUILT_AT \
            -e WEBCODEX_RELEASE_VERSION \
            -e WEBCODEX_GIT_COMMIT \
            -e WEBCODEX_GIT_DIRTY \
            -e BUILD_KIND \
            -e ARCHIVE_STEM \
            -e WEBCODEX_RELEASE_PLATFORM \
            "$MANYLINUX_IMAGE" \
            bash -lc '
              set -euo pipefail
              export PATH="/cargo/bin:$PATH"
              git config --global --add safe.directory /work

              if [ "$(uname -m)" != "${{ matrix.machine }}" ]; then
                echo "Unexpected native architecture: $(uname -m)" >&2
                exit 1
              fi
              if [ "$(git rev-parse HEAD)" != "$SOURCE_SHA" ]; then
                echo "Build checkout does not match prepared release commit." >&2
                exit 1
              fi
              if [ -n "$(git status --porcelain --untracked-files=all)" ]; then
                echo "Build checkout is not clean before compilation." >&2
                exit 1
              fi

              if ! command -v git >/dev/null 2>&1 || ! command -v curl >/dev/null 2>&1; then
                yum install -y git curl
              fi

              if [ ! -x /cargo/bin/rustup ]; then
                curl --proto "=https" --tlsv1.2 -sSf https://sh.rustup.rs \
                  | sh -s -- -y --profile minimal --default-toolchain stable
              fi
              rustup toolchain install stable --profile minimal
              rustup default stable
              rustc --version --verbose
              cargo --version --verbose

              cargo build --locked --release -p webcodex -p webcodex-runner

              for name in webcodex-server webcodex-runner; do
                binary="target/release/$name"
                output="$($binary --version)"
                expected="$name $VERSION (commit $SOURCE_SHA, dirty=false, built_at=$WEBCODEX_BUILT_AT)"
                if [ "$output" != "$expected" ]; then
                  echo "Unexpected $name release identity: $output" >&2
                  echo "Expected: $expected" >&2
                  exit 1
                fi
                if ! readelf -h "$binary" | grep -F "Machine:" | grep -Fq "${{ matrix.elf_machine }}"; then
                  echo "Unexpected ELF architecture for $binary" >&2
                  readelf -h "$binary" >&2
                  exit 1
                fi
              done

              report="dist/${WEBCODEX_RELEASE_PLATFORM}-elf.txt"
              : > "$report"
              allowed_needed="libc.so.6 libm.so.6 libgcc_s.so.1 libpthread.so.0 libdl.so.2 librt.so.1 libresolv.so.2 ld-linux-x86-64.so.2 ld-linux-aarch64.so.1"
              for name in webcodex-server webcodex-runner; do
                binary="target/release/$name"
                {
                  echo "== $name: ELF header =="
                  readelf -h "$binary"
                  echo "== $name: dynamic dependencies =="
                  readelf -d "$binary"
                  echo "== $name: version requirements =="
                  readelf --version-info "$binary"
                  echo
                } >> "$report"

                max_glibc="$(readelf --version-info "$binary" \
                  | grep -oE "GLIBC_[0-9]+(\.[0-9]+)*" \
                  | sed "s/^GLIBC_//" \
                  | sort -Vu \
                  | tail -n 1 || true)"
                if [ -n "$max_glibc" ] && [ "$(printf "%s\n" 2.17 "$max_glibc" | sort -V | tail -n 1)" != "2.17" ]; then
                  echo "$binary requires GLIBC_$max_glibc, exceeding the 2.17 release floor." >&2
                  exit 1
                fi

                while IFS= read -r needed; do
                  case " $allowed_needed " in
                    *" $needed "*) ;;
                    *) echo "$binary has unexpected DT_NEEDED dependency: $needed" >&2; exit 1 ;;
                  esac
                done < <(readelf -d "$binary" | sed -n "s/.*Shared library: \[\([^]]*\)\].*/\1/p")
              done

              scripts/package_release_artifact.sh dist
              canonical_archive="dist/webcodex-v$VERSION-$WEBCODEX_RELEASE_PLATFORM.tar.gz"
              archive="dist/$ARCHIVE_STEM-$WEBCODEX_RELEASE_PLATFORM.tar.gz"
              if [ "$canonical_archive" != "$archive" ]; then
                mv "$canonical_archive" "$archive"
              fi
              digest="$(sha256sum "$archive" | awk "{print \$1}")"
              printf "%s  %s\n" "$digest" "$(basename "$archive")" > "$archive.sha256"
            '

      - name: Upload Linux candidate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ needs.prepare.outputs.archive_stem }}-${{ matrix.platform }}
          path: |
            dist/${{ needs.prepare.outputs.archive_stem }}-${{ matrix.platform }}.tar.gz
            dist/${{ needs.prepare.outputs.archive_stem }}-${{ matrix.platform }}.tar.gz.sha256
            dist/${{ matrix.platform }}-elf.txt
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  macos:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: darwin-arm64
            runner: macos-15
            host_arch: arm64
            rust_host: aarch64-apple-darwin
            file_arch: arm64
          - platform: darwin-x64
            runner: macos-15-intel
            host_arch: x86_64
            rust_host: x86_64-apple-darwin
            file_arch: x86_64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 75
    env:
      WEBCODEX_MACOS_CERTIFICATE_SHA1: ${{ vars.MACOS_CERTIFICATE_SHA1 }}
      VERSION: ${{ needs.prepare.outputs.version }}
      SOURCE_SHA: ${{ needs.prepare.outputs.source_sha }}
      WEBCODEX_BUILT_AT: ${{ needs.prepare.outputs.built_at }}
      WEBCODEX_RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
      BUILD_KIND: ${{ needs.prepare.outputs.build_kind }}
      WEBCODEX_GIT_COMMIT: ${{ needs.prepare.outputs.source_sha }}
      WEBCODEX_GIT_DIRTY: 'false'
      ARCHIVE_STEM: ${{ needs.prepare.outputs.archive_stem }}
      WEBCODEX_RELEASE_PLATFORM: ${{ matrix.platform }}
      EXPECTED_HOST_ARCH: ${{ matrix.host_arch }}
      EXPECTED_RUST_HOST: ${{ matrix.rust_host }}
      EXPECTED_FILE_ARCH: ${{ matrix.file_arch }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
          ref: refs/tags/${{ inputs.tag }}
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: release-${{ matrix.platform }}

      - name: Configure persistent macOS signing
        shell: bash
        env:
          WEBCODEX_MACOS_SIGNING_MODE: ${{ vars.MACOS_SIGNING_MODE || 'self-signed' }}
          WEBCODEX_MACOS_CERTIFICATE_SHA1: ${{ vars.MACOS_CERTIFICATE_SHA1 }}
          APPLE_CERTIFICATE: ${{ secrets.MACOS_SIGNING_P12 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_SIGNING_P12_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ vars.MACOS_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
        run: bash scripts/macos_ci_signing_setup.sh


      - name: Build and verify native macOS candidate
        shell: bash
        run: |
          set -euo pipefail
          if [ "$(uname -m)" != "$EXPECTED_HOST_ARCH" ]; then
            echo "Expected native macOS host $EXPECTED_HOST_ARCH, got $(uname -m)." >&2
            exit 1
          fi
          rust_host="$(rustc -vV | sed -n 's/^host: //p')"
          if [ "$rust_host" != "$EXPECTED_RUST_HOST" ]; then
            echo "Expected native Rust host $EXPECTED_RUST_HOST, got $rust_host." >&2
            rustc -vV >&2
            exit 1
          fi
          if [ "$(git rev-parse HEAD)" != "$SOURCE_SHA" ]; then
            echo "Build checkout does not match prepared release commit." >&2
            exit 1
          fi
          if [ -n "$(git status --porcelain --untracked-files=all)" ]; then
            echo "Build checkout is not clean before compilation." >&2
            exit 1
          fi

          rustc --version --verbose
          cargo build --locked --release -p webcodex -p webcodex-runner
          for name in webcodex-server webcodex-runner; do
            binary="target/release/$name"
            output="$($binary --version)"
            expected="$name $VERSION (commit $SOURCE_SHA, dirty=false, built_at=$WEBCODEX_BUILT_AT)"
            if [ "$output" != "$expected" ]; then
              echo "Unexpected $name release identity: $output" >&2
              exit 1
            fi
            file_output="$(file "$binary")"
            if [[ "$file_output" != *"$EXPECTED_FILE_ARCH"* ]]; then
              echo "Unexpected Mach-O architecture for $binary: $file_output" >&2
              exit 1
            fi
          done

          mkdir -p dist
          bash scripts/macos_sign_runner.sh target/release/webcodex-runner "$APPLE_SIGNING_IDENTITY" "$WEBCODEX_MACOS_SIGNING_MODE"

          scripts/package_release_artifact.sh dist
          canonical_archive="dist/webcodex-v$VERSION-$WEBCODEX_RELEASE_PLATFORM.tar.gz"
          archive="dist/$ARCHIVE_STEM-$WEBCODEX_RELEASE_PLATFORM.tar.gz"
          if [ "$canonical_archive" != "$archive" ]; then
            mv "$canonical_archive" "$archive"
          fi
          digest="$(shasum -a 256 "$archive" | awk '{print $1}')"
          printf '%s  %s\n' "$digest" "$(basename "$archive")" > "$archive.sha256"

      - name: Clean ephemeral signing material
        if: always()
        shell: bash
        run: |
          if [ -n "${WEBCODEX_SIGNING_KEYCHAIN:-}" ]; then
            security delete-keychain "$WEBCODEX_SIGNING_KEYCHAIN"
          fi

      - name: Upload macOS candidate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ needs.prepare.outputs.archive_stem }}-${{ matrix.platform }}
          path: |
            dist/${{ needs.prepare.outputs.archive_stem }}-${{ matrix.platform }}.tar.gz
            dist/${{ needs.prepare.outputs.archive_stem }}-${{ matrix.platform }}.tar.gz.sha256
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  windows:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: win32-x64
            runner: windows-latest
            rust_target: x86_64-pc-windows-msvc
            processor_architecture: AMD64
            pe_machine: "8664"
            node_architecture: x64
          - platform: win32-arm64
            runner: windows-11-arm
            rust_target: aarch64-pc-windows-msvc
            processor_architecture: ARM64
            pe_machine: "AA64"
            node_architecture: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      SOURCE_SHA: ${{ needs.prepare.outputs.source_sha }}
      WEBCODEX_BUILT_AT: ${{ needs.prepare.outputs.built_at }}
      BUILD_KIND: ${{ needs.prepare.outputs.build_kind }}
      ARCHIVE_STEM: ${{ needs.prepare.outputs.archive_stem }}
      WEBCODEX_RELEASE_PLATFORM: ${{ matrix.platform }}
      RUST_TARGET: ${{ matrix.rust_target }}
      WEBCODEX_GIT_COMMIT: ${{ needs.prepare.outputs.source_sha }}
      WEBCODEX_GIT_DIRTY: 'false'
      INPUT_TAG: ${{ inputs.tag }}
      EXPECTED_PROCESSOR_ARCHITECTURE: ${{ matrix.processor_architecture }}
      EXPECTED_PE_MACHINE: ${{ matrix.pe_machine }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
          ref: refs/tags/${{ inputs.tag }}
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          targets: ${{ matrix.rust_target }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          architecture: ${{ matrix.node_architecture }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: release-${{ matrix.platform }}

      - name: Build and verify native Windows candidate
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          if ($env:PROCESSOR_ARCHITECTURE -ne $env:EXPECTED_PROCESSOR_ARCHITECTURE) {
            throw "Unexpected Windows host architecture: $env:PROCESSOR_ARCHITECTURE (expected $env:EXPECTED_PROCESSOR_ARCHITECTURE)"
          }
          $hostLine = rustc -vV | Select-String '^host: '
          if ($hostLine.Line -ne "host: $env:RUST_TARGET") {
            throw "Expected native Rust host $env:RUST_TARGET; got $($hostLine.Line)"
          }
          if ((git rev-parse HEAD).Trim() -ne $env:SOURCE_SHA) {
            throw "Build checkout does not match prepared release commit."
          }
          if (@(git status --porcelain --untracked-files=all).Count -ne 0) {
            throw "Build checkout is not clean before compilation."
          }

          rustc --version --verbose
          cargo build --locked --release --target $env:RUST_TARGET -p webcodex -p webcodex-runner
          if ($LASTEXITCODE -ne 0) { throw "cargo build failed with exit code $LASTEXITCODE" }

          $binDir = Join-Path "target" (Join-Path $env:RUST_TARGET "release")
          $expectedMachine = [Convert]::ToUInt16($env:EXPECTED_PE_MACHINE, 16)
          foreach ($name in @("webcodex-server", "webcodex-runner")) {
            $binary = Join-Path $binDir "$name.exe"
            $outputLines = @(& $binary --version)
            $exitCode = $LASTEXITCODE
            if ($exitCode -ne 0 -or $outputLines.Count -eq 0 -or -not $outputLines[0]) {
              throw "$name --version failed with exit code $exitCode"
            }
            $output = $outputLines[0].TrimEnd()
            $expected = "$name $env:VERSION (commit $env:SOURCE_SHA, dirty=false, built_at=$env:WEBCODEX_BUILT_AT)"
            if ($output -ne $expected) {
              throw "Unexpected $name release identity: $output (expected $expected)"
            }

            $bytes = [System.IO.File]::ReadAllBytes((Resolve-Path $binary))
            if ($bytes.Length -lt 64) { throw "$binary is too small to be a PE image" }
            $peOffset = [BitConverter]::ToInt32($bytes, 0x3c)
            $machine = [BitConverter]::ToUInt16($bytes, $peOffset + 4)
            if ($machine -ne $expectedMachine) {
              throw ("Unexpected PE machine for {0}: 0x{1:x4}" -f $binary, $machine)
            }
          }

          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $packArgs = @(
            "-NoProfile", "-ExecutionPolicy", "Bypass", "-File", "scripts\package_release_artifact.ps1",
            "-BinDir", $binDir,
            "-OutDir", "dist",
            "-Version", $env:VERSION,
            "-Platform", $env:WEBCODEX_RELEASE_PLATFORM
          )
          if ($env:BUILD_KIND -eq "verification") {
            $packArgs += "-AllowDevelopmentBuild"
          }
          & powershell @packArgs
          if ($LASTEXITCODE -ne 0) { throw "Windows release packaging failed with exit code $LASTEXITCODE" }

          $canonicalArchive = Join-Path "dist" "webcodex-v$env:VERSION-$env:WEBCODEX_RELEASE_PLATFORM.tar.gz"
          $archive = Join-Path "dist" "$env:ARCHIVE_STEM-$env:WEBCODEX_RELEASE_PLATFORM.tar.gz"
          if ($canonicalArchive -ne $archive) {
            Move-Item -LiteralPath $canonicalArchive -Destination $archive
          }
          $hash = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          $checksumLine = "$hash  $(Split-Path -Leaf $archive)`n"
          [System.IO.File]::WriteAllText("$archive.sha256", $checksumLine, [System.Text.Encoding]::ASCII)


      - name: Upload Windows candidate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ needs.prepare.outputs.archive_stem }}-${{ matrix.platform }}
          path: |
            dist/${{ needs.prepare.outputs.archive_stem }}-${{ matrix.platform }}.tar.gz
            dist/${{ needs.prepare.outputs.archive_stem }}-${{ matrix.platform }}.tar.gz.sha256
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  assemble:
    needs: [prepare, linux, macos, windows]
    if: >-
      always() &&
      needs.prepare.result == 'success' &&
      needs.linux.result == 'success' &&
      needs.macos.result == 'success' &&
      needs.windows.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      SOURCE_SHA: ${{ needs.prepare.outputs.source_sha }}
      WEBCODEX_BUILT_AT: ${{ needs.prepare.outputs.built_at }}
      BUILD_KIND: ${{ needs.prepare.outputs.build_kind }}
      ARCHIVE_STEM: ${{ needs.prepare.outputs.archive_stem }}
      INPUT_TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
          ref: refs/tags/${{ inputs.tag }}

      - name: Download exact same-run runtime candidates
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: ${{ needs.prepare.outputs.archive_stem }}-*
          path: candidate-input
          merge-multiple: true

      - name: Verify and assemble runtime-only bundle
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import json
          import os
          import shutil
          from pathlib import Path

          platforms = ("linux-x64", "linux-arm64", "darwin-x64", "darwin-arm64", "win32-x64", "win32-arm64")
          stem = os.environ["ARCHIVE_STEM"]
          source = Path("candidate-input")
          output = Path("release-bundle")
          expected = {"linux-x64-elf.txt", "linux-arm64-elf.txt"}
          for platform in platforms:
              filename = f"{stem}-{platform}.tar.gz"
              expected.update((filename, f"{filename}.sha256"))
          actual = {item.name for item in source.iterdir()}
          if actual != expected or any(not item.is_file() or item.is_symlink() for item in source.iterdir()):
              raise SystemExit(f"unexpected same-run artifact set: expected={sorted(expected)} actual={sorted(actual)}")

          output.mkdir(exist_ok=False)
          artifacts = {}
          for platform in platforms:
              filename = f"{stem}-{platform}.tar.gz"
              path = source / filename
              if not 0 < path.stat().st_size <= 768 * 1024 * 1024:
                  raise SystemExit(f"invalid runtime archive size: {filename}")
              with path.open("rb") as handle:
                  digest = hashlib.file_digest(handle, "sha256").hexdigest()
              expected_line = f"{digest}  {filename}"
              if (source / f"{filename}.sha256").read_text(encoding="ascii").strip() != expected_line:
                  raise SystemExit(f"runtime archive checksum mismatch: {filename}")
              shutil.copyfile(path, output / filename)
              artifacts[platform] = {"filename": filename, "sha256": digest}

          for platform in ("linux-x64", "linux-arm64"):
              report = source / f"{platform}-elf.txt"
              if not 0 < report.stat().st_size <= 2 * 1024 * 1024:
                  raise SystemExit(f"Linux ELF evidence missing or invalid: {report.name}")
              shutil.copyfile(report, output / report.name)

          if os.environ["BUILD_KIND"] == "verification":
              checksums = "".join(
                  f'{artifacts[platform]["sha256"]}  {artifacts[platform]["filename"]}\n'
                  for platform in platforms
              )
              (output / "SHA256SUMS").write_text(checksums, encoding="ascii")
          payload = {
              "tag": os.environ["INPUT_TAG"],
              "version": os.environ["VERSION"],
              "source_sha": os.environ["SOURCE_SHA"],
              "built_at": int(os.environ["WEBCODEX_BUILT_AT"]),
              "build_kind": os.environ["BUILD_KIND"],
              "workflow_run_id": int(os.environ["GITHUB_RUN_ID"]),
              "archive_stem": stem,
              "artifacts": artifacts,
              "desktop_artifacts": {},
          }
          (output / "release-build.json").write_text(json.dumps(payload, indent=2) + "\n", encoding="utf-8")
          PY
          if [ "$BUILD_KIND" = release ]; then
            python3 scripts/prepare_release_metadata.py \
              --version "$VERSION" \
              --source-sha "$SOURCE_SHA" \
              --workflow-run-id "$GITHUB_RUN_ID" \
              --workflow-ref "$GITHUB_WORKFLOW_REF" \
              --artifact-dir candidate-input \
              --output-dir release-bundle
          fi

      - name: Verify final bundle identity and contents
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          from pathlib import Path
          from scripts.collect_release_bundle import verify_bundle_directory
          verify_bundle_directory(
              Path("release-bundle"),
              repo=os.environ["GITHUB_REPOSITORY"],
              run_id=int(os.environ["GITHUB_RUN_ID"]),
              expected_source_sha=os.environ["SOURCE_SHA"],
              expected_tag=os.environ["INPUT_TAG"],
              artifact_name=os.environ["ARCHIVE_STEM"] + "-bundle",
          )
          PY

      - name: Upload assembled headless release
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ needs.prepare.outputs.archive_stem }}-bundle
          path: release-bundle/*
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
